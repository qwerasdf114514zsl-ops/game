<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排错测试</title>
<!-- 换用 jsdelivr 的 CDN 库 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#070a12; color:#fff; padding:20px; font-family:sans-serif;">
  <script>
    // 抓住任何报错
    window.onerror = function(msg, url, line) {
      alert("程序崩溃啦！\n原因: " + msg + "\n行号: " + line);
      return false;
    };
  </script>
  
  <h2>排错测试大厅</h2>
  <button id="btn" onclick="testCreate()" style="padding:15px 30px; font-size:18px; background:#4d7cfe; color:white; border:none; border-radius:8px;">
    点击测试创建房间
  </button>
  <p id="status" style="color:#ffb454;"></p>
  
  <script>
    // 用了最安全的写法，确保按钮一定点得动
    async function testCreate() {
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      btn.innerText = "正在连接...";
      btn.disabled = true;
      status.innerText = "正在请求数据库，请稍候...";

      try {
        // 检查库有没有加载出来
        if (typeof window.supabase === 'undefined') {
          throw new Error("Supabase 代码库没加载出来！请检查你的 VPN 是否开启了全局模式。");
        }

        // 初始化
        const client = window.supabase.createClient('https://louffiaacjcwxknzpign.supabase.co', 'sb_publishable_s0_DdhJkssY-wwRzWUyZCA_QG8onczZ');
        
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        
        // 尝试插入数据
        const { data, error } = await client.from('rooms').insert({
          room_id: code,
          public_state: { status: 'waiting' },
          private_p1: { test: true }
        });

        if (error) throw new Error(error.message);

        alert("大成功！房间已创建，房间码：" + code + "\n说明你的网络和数据库都没问题！");
        status.innerText = "成功！";
        
      } catch (err) {
        alert("测试失败！原因：\n" + err.message);
        status.innerText = "失败了，看弹窗。";
      } finally {
        btn.innerText = "重新测试";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
