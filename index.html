<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节奏对决 · 联机战棋版</title>
<!-- 引入 Supabase 库 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#070a12; color:#fff; padding:10px; font-family:sans-serif;">

  <!-- 这个脚本用来抓取任何报错并弹窗 -->
  <script>
    window.onerror = function(msg, url, line) {
      alert("游戏代码报错啦！\n原因: " + msg + "\n行号: " + line);
      return false;
    };
  </script>

  <!-- 大厅界面 -->
  <div id="lobbyScreen" style="max-width:400px; margin:100px auto; text-align:center; background:#18213c; padding:30px; border-radius:20px; border:1px solid #4d7cfe;">
    <h2 style="color:#ffd76a; margin-top:0;">节奏对决 · 联机版</h2>
    <p style="color:#8a97b8; font-size:13px;">输入昵称，创建或加入房间</p>
    <input type="text" id="playerName" placeholder="你的昵称" value="玩家" style="padding:10px; border-radius:8px; border:none; width:80%; margin-bottom:15px; text-align:center;">
    <button id="btnCreate" onclick="createRoom()" style="width:100%; padding:12px; background:#4d7cfe; color:white; border:none; border-radius:8px; font-weight:bold; margin-bottom:10px;">创建新房间</button>
    
    <div style="margin:15px 0; color:#8a97b8; font-size:12px;">— 或者 —</div>
    
    <input type="text" id="joinRoomCode" placeholder="输入 6 位房间码" maxlength="6" style="padding:10px; border-radius:8px; border:none; width:80%; margin-bottom:15px; text-align:center;">
    <button id="btnJoin" onclick="joinRoom()" style="width:100%; padding:12px; background:#35d6a4; color:#000; border:none; border-radius:8px; font-weight:bold;">加入房间</button>
  </div>

  <!-- 等待对手界面 -->
  <div id="waitScreen" style="display:none; max-width:400px; margin:100px auto; text-align:center; background:#18213c; padding:30px; border-radius:20px;">
    <h2 style="color:#35d6a4;">等待对手加入...</h2>
    <p style="color:#8a97b8;">把房间码发给你的朋友：</p>
    <div id="displayRoomCode" style="font-size:40px; font-weight:bold; color:#ffd76a; letter-spacing:5px; margin:20px 0;">------</div>
  </div>

  <!-- 游戏主界面 (先隐藏) -->
  <div id="gameScreen" style="display:none;">
    <h2>游戏已开始！(排版极简版测试)</h2>
    <p>如果看到这里，说明联机彻底成功了！你的完整战棋界面代码在我下一版给你，现在我们先把网络跑通。</p>
    <button onclick="location.reload()">退出</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://louffiaacjcwxknzpign.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_s0_DdhJkssY-wwRzWUyZCA_QG8onczZ';

    // 检查库有没有加载成功
    if (typeof window.supabase === 'undefined') {
      alert("严重错误：Supabase 库没有加载出来！请切换你的 VPN 节点。");
    }

    // 用 client 变量名，避免和 window.supabase 冲突
    let client;
    try {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) {
      alert("初始化失败: " + e.message);
    }

    let myRole = null, myRoomId = null;

    async function createRoom() {
      const btn = document.getElementById('btnCreate');
      btn.textContent = '正在连接...';
      
      try {
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        myRoomId = code;
        myRole = 'p1';

        const { data, error } = await client.from('rooms').insert({
          room_id: code,
          public_state: { status: 'waiting', turn: 1 },
          private_p1: { test: true }
        });

        if (error) throw new Error(error.message);

        document.getElementById('lobbyScreen').style.display = 'none';
        document.getElementById('waitScreen').style.display = 'block';
        document.getElementById('displayRoomCode').textContent = code;

        // 进入监听状态
        client.channel('room_' + code)
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `room_id=eq.${code}` }, payload => {
            if (payload.new.public_state.status === 'playing') {
              document.getElementById('waitScreen').style.display = 'none';
              document.getElementById('gameScreen').style.display = 'block';
            }
          }).subscribe();

      } catch (err) {
        alert('创建失败：\n' + err.message);
        btn.textContent = '创建新房间';
      }
    }

    async function joinRoom() {
      const btn = document.getElementById('btnJoin');
      btn.textContent = '正在连接...';
      try {
        const code = document.getElementById('joinRoomCode').value.trim();
        if (code.length !== 6) throw new Error('房间码必须是 6 位');

        const { data, error } = await client.from('rooms').select('*').eq('room_id', code).single();
        if (error || !data) throw new Error('找不到这个房间！');
        
        const newPublic = data.public_state;
        newPublic.status = 'playing';

        await client.from('rooms').update({ public_state: newPublic }).eq('room_id', code);
        
        document.getElementById('lobbyScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';

      } catch (err) {
        alert('加入失败：\n' + err.message);
        btn.textContent = '加入房间';
      }
    }
  </script>
</body>
</html>
